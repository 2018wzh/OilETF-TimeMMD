date_range:
  start: 2016-01-01
  end: 2026-06-24

timezone: US/Eastern

symbols:
  - USO
  - BNO
  - DBO
  - USL
  - SCO

target_symbol: USO

windows:
  H: [60, 120]
  F: [1, 5]

calendar:
  source_symbol: SPY

collection:
  include_news: true
  include_reports: true
  news_sources: [finnhub, gdelt]
  preserve_existing_news: true
  news_per_symbol_limit: 200
  news_cutoff_hour_et: 16
  max_report_items_per_source: 20
  finnhub:
    endpoint: https://finnhub.io/api/v1/company-news
    min_request_interval_seconds: 1.0
    retry_count: 2
    retry_backoff_seconds: 5
    timeout_seconds: 30
  # keep optional and explicit: FINNHUB_API_KEY is loaded from .env or config.finnhub.api_key
  # api_key: YOUR_FINNHUB_API_KEY
  gdelt:
    endpoint: http://api.gdeltproject.org/api/v2/doc/doc
    query: '("crude oil" OR WTI OR Brent OR OPEC)'
    max_records_per_query: 100
    interval_months: 6
    sort: HybridRel
    language: English
    min_request_interval_seconds: 5.5
    retry_count: 2
    rate_limit_backoff_seconds: 30
    timeout_seconds: 30

macro:
  fred:
    wti: DCOILWTICO
    brent: DCOILBRENTEU
    dxy: DTWEXB
  eia_inventory:
    crude: WCESTUS1
    gasoline: WGTSTUS1
    distillate: WDISTUS1
  yfinance:
    - SPY
    - XLE
    - ^VIX

paths:
  raw: data/raw
  processed: data/processed
  timemmd_numerical: data/numerical/OilETF
  timemmd_textual: data/textual/OilETF
  images: data/images/OilETF
  metadata: data/metadata
  outputs: outputs

split:
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  method: time_order

sample_settings:
  - H: 60
    F: 1
  - H: 120
    F: 5

intraday:
  enabled: true
  symbols: [USO, BNO, DBO, USL, SCO]
  lookback_years: 2
  source: finnhub
  news_sources: [finnhub, gdelt]
  yfinance_period: 730d
  session: regular
  bar_minutes: 60
  finnhub:
    endpoint: https://finnhub.io/api/v1/company-news
    min_request_interval_seconds: 1.0
    retry_count: 2
    retry_backoff_seconds: 5
    timeout_seconds: 30
  sample_settings:
    - H: 60
      F: 1
    - H: 120
      F: 7

technical:
  ma_windows: [5, 20, 60]
  ema_windows: [12, 26]
  atr_window: 14
  rsi_window: 14
  macd_signal: 9
  vol_windows: [5, 20]
  news_keyword:
    - crude oil
    - WTI
    - Brent
    - OPEC
    - EIA
    - API
    - inventory
    - production
    - supply
    - demand
    - Iran
    - Saudi
    - Russia
    - Middle East
    - hurricane
    - DXY
    - USD
    - inflation
    - sanctions
    - refinery

outputs:
  dataset_name: OilETF
  dataset_version: 0.1.0

huggingface:
  repo_id: "2018wzh/OilETF-TimeMMD"
  private: false
